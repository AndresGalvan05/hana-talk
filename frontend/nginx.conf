server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback: client-side routes (/courses/<id>, ...) must serve the app
    location / {
        try_files $uri /index.html;
    }

    # /api is routed to core-api by the ingress before it ever reaches nginx.
    # If a request still lands here the routing is broken — fail loudly rather
    # than serve the SPA shell as a 200 where the client expects JSON.
    location /api/ {
        return 404;
    }

    # Vite emits content-hashed filenames under /assets — safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html references the hashed assets and must always be revalidated
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
