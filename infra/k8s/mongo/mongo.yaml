# Single-replica StatefulSet, same rationale as postgres.yaml (RWO PVC
# needs stable identity, not a Deployment). No auth configured — matches
# local dev and Kafka's existing posture: ClusterIP only, never reaches
# the ingress, so network isolation is the boundary, not credentials.
# --wiredTigerCacheSizeGB keeps Mongo well inside its memory limit on a
# shared, resource-constrained node rather than sizing off host RAM.
# --bind_ip_all is required here specifically because `command:` overrides
# the official image's ENTRYPOINT (docker-entrypoint.sh) entirely, so its
# usual auto-injection of --bind_ip_all never runs; mongod's own default
# (loopback-only) took over instead, making Mongo unreachable from any
# other pod via the Service. Local docker-compose never hit this because
# it uses the image's default CMD without overriding `command`.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: hanatalk
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:8
          command: ["mongod", "--wiredTigerCacheSizeGB=0.25", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: hanatalk
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
