apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-api
  template:
    metadata:
      labels:
        app: core-api
    spec:
      containers:
        - name: core-api
          image: ghcr.io/andoleafs/hanatalk/core-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: core-api-config
            - secretRef:
                name: core-api-secret
          resources:
            requests:
              cpu: "256m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
