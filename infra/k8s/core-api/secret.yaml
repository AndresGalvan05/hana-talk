# PLACEHOLDER — do not commit real values here.
# Provision the secret manually on the cluster:
#
#   kubectl create secret generic core-api-secret \
#     --from-literal=DB_USERNAME=<value> \
#     --from-literal=DB_PASSWORD=<value> \
#     --from-literal=JWT_SECRET=<value> \
#     -n dev
apiVersion: v1
kind: Secret
metadata:
  name: core-api-secret
  namespace: dev
type: Opaque
data:
  DB_USERNAME: <base64-encoded-value>
  DB_PASSWORD: <base64-encoded-value>
  JWT_SECRET: <base64-encoded-value>
