apiVersion: v1
kind: ConfigMap
metadata:
  name: core-api-config
  namespace: hanatalk
data:
  DB_URL: "jdbc:postgresql://postgres:5432/hanatalk"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  # Grafana Cloud OTLP endpoint (M5) — direct export, no in-cluster
  # collector/agent. Endpoint URLs are meaningless without the
  # Authorization header in core-api-secret (OTEL_EXPORTER_OTLP_AUTH),
  # so it's safe for these to be plain configmap values.
  OTEL_SAMPLING_PROBABILITY: "1.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://otlp-gateway-prod-sa-east-1.grafana.net/otlp/v1/traces"
  GRAFANA_CLOUD_OTLP_METRICS_URL: "https://otlp-gateway-prod-sa-east-1.grafana.net/otlp/v1/metrics"
  GRAFANA_CLOUD_METRICS_ENABLED: "true"
  # Prod traffic is same-origin (/api via ingress) so CORS never triggers;
  # this just stops the localhost dev default from leaking into prod config.
  CORS_ALLOWED_ORIGINS: "https://hanatalk.online"
