services:
  jaeger:
    # all-in-one: OTLP ingestion (native since 1.35) + query UI in one
    # container. Local-only trace verification — not a production
    # observability decision (Grafana Cloud is a separate M5 slice).
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hanatalk
      POSTGRES_USER: hanatalk
      POSTGRES_PASSWORD: hanatalk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanatalk"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    # bitnami/kafka images were withdrawn from Docker Hub in 2025; use the
    # official Apache image. Two listeners: INTERNAL for containers on the
    # compose network (kafka:29092), HOST for processes on the host machine
    # (localhost:9092, matching core-api's local default).
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    build:
      context: ../core-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hanatalk
      DB_USERNAME: hanatalk
      DB_PASSWORD: hanatalk
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AI_EXERCISE_SVC_URL: http://ai-exercise-svc:8000
      EVENT_WORKER_URL: http://event-worker:8090
    # core-api.defaults.env sets the local-Jaeger OTLP endpoint (safe to
    # commit). The optional Grafana Cloud file, set via GRAFANA_CLOUD_ENV_PATH
    # in a local infra/.env, overrides it -- later env_file entries win --
    # so docker-compose can be pointed at the real Grafana Cloud endpoint
    # for local verification without touching this tracked file.
    env_file:
      - path: ./core-api.defaults.env
      - path: ${GRAFANA_CLOUD_ENV_PATH:-/dev/null}
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-exercise-svc:
    build:
      context: ../ai-exercise-svc
    ports:
      - "8000:8000"
    # Provider API keys live outside the repo, at a path only known on this
    # machine — set via LLM_KEYS_ENV_PATH in a local, gitignored infra/.env
    # (see infra/.env.example). Never hardcode a real path here: this file
    # is tracked and public.
    env_file:
      - ${LLM_KEYS_ENV_PATH}
    environment:
      MONGO_URI: mongodb://mongo:27017
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      mongo:
        condition: service_healthy
      jaeger:
        condition: service_started

  event-worker:
    build:
      context: ../event-worker
    ports:
      - "8090:8090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: postgres://hanatalk:hanatalk@postgres:5432/hanatalk
      INTERNAL_API_PORT: "8090"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started

volumes:
  postgres_data:
  mongo_data:
