services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hanatalk
      POSTGRES_USER: hanatalk
      POSTGRES_PASSWORD: hanatalk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanatalk"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-api:
    build:
      context: ../core-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hanatalk
      DB_USERNAME: hanatalk
      DB_PASSWORD: hanatalk
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
