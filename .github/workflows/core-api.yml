name: core-api

on:
  push:
    branches: [main]
    paths:
      - "core-api/**"
      - ".github/workflows/core-api.yml"
  pull_request:
    paths:
      - "core-api/**"
      - ".github/workflows/core-api.yml"

env:
  IMAGE: ghcr.io/andresgalvan05/hana-talk/core-api

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: core-api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew ktlintCheck --no-daemon

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Build
        run: ./gradlew bootJar --no-daemon

      # Multi-arch: the k3s node (Oracle A1 Flex) is arm64, dev machines are
      # amd64. The Dockerfile cross-builds (Gradle runs on $BUILDPLATFORM), so
      # QEMU only covers incidental foreign-arch steps, not the JVM build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch image (push on main)
        uses: docker/build-push-action@v7
        with:
          context: core-api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
