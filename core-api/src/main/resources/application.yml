spring:
  application:
    name: core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hanatalk}
    username: ${DB_USERNAME:hanatalk}
    password: ${DB_PASSWORD:hanatalk}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Events are best-effort side effects; never stall a user-facing
        # request longer than this waiting for broker metadata (default 60s).
        max.block.ms: 3000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

jwt:
  secret: ${JWT_SECRET:dev-local-only-secret-not-for-production!!}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

ai-exercise-svc:
  url: ${AI_EXERCISE_SVC_URL:http://localhost:8000}
  # ai-exercise-svc now falls back Gemini -> Groq -> OpenRouter internally
  # (provider-failover-chain). A forced Gemini failure measured ~60s before
  # falling through to Groq, plus Groq's own generation time — 45s was no
  # longer enough headroom even for a single-fallback path, let alone a
  # double fallback to OpenRouter.
  timeout-seconds: ${AI_EXERCISE_SVC_TIMEOUT_SECONDS:90}
