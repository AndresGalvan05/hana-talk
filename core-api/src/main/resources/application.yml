spring:
  application:
    name: core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hanatalk}
    username: ${DB_USERNAME:hanatalk}
    password: ${DB_PASSWORD:hanatalk}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:dev-local-only-secret-not-for-production!!}
