spring:
  application:
    name: core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hanatalk}
    username: ${DB_USERNAME:hanatalk}
    password: ${DB_PASSWORD:hanatalk}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Events are best-effort side effects; never stall a user-facing
        # request longer than this waiting for broker metadata (default 60s).
        max.block.ms: 3000
    template:
      # The one property needed for KafkaTemplate.send() to inject a W3C
      # traceparent header into published records — verified against
      # Spring Kafka's own sample-08 (producer/consumer sharing a trace id).
      observation-enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      headers:
        # Empty by default (local Jaeger needs no auth); set to Grafana
        # Cloud's Basic-auth value in production only.
        Authorization: ${OTEL_EXPORTER_OTLP_AUTH:}
    metrics:
      export:
        # Explicit opt-in: having micrometer-registry-otlp on the classpath
        # would otherwise auto-enable export (Spring Boot's
        # @ConditionalOnEnabledMetricsExport defaults true) and start
        # POSTing to an empty URL in every dev/CI run.
        enabled: ${GRAFANA_CLOUD_METRICS_ENABLED:false}
        url: ${GRAFANA_CLOUD_OTLP_METRICS_URL:}
        headers:
          Authorization: ${OTEL_EXPORTER_OTLP_AUTH:}

jwt:
  secret: ${JWT_SECRET:dev-local-only-secret-not-for-production!!}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

ai-exercise-svc:
  url: ${AI_EXERCISE_SVC_URL:http://localhost:8000}
  # ai-exercise-svc now falls back Gemini -> Groq -> OpenRouter internally
  # (provider-failover-chain). A forced Gemini failure measured ~60s before
  # falling through to Groq, plus Groq's own generation time — 45s was no
  # longer enough headroom even for a single-fallback path, let alone a
  # double fallback to OpenRouter.
  timeout-seconds: ${AI_EXERCISE_SVC_TIMEOUT_SECONDS:90}

event-worker:
  url: ${EVENT_WORKER_URL:http://localhost:8090}
  timeout-seconds: ${EVENT_WORKER_TIMEOUT_SECONDS:10}
